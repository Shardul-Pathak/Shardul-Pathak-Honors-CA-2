spring.application.name=parking-management-system-test

# H2 in-memory database with PostgreSQL compatibility mode for automated testing
spring.datasource.url=jdbc:h2:mem:parking_test_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Flyway disabled in test profile so JPA creates schema dynamically in H2
spring.flyway.enabled=false
